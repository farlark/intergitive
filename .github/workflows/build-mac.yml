name: Build macOS app

# Builds the intergitive Electron app for macOS.
#
# The app targets Electron 41.3.0, which is the version nodegit
# 0.28.0-alpha.38 publishes prebuilt binaries for (ABI tag electron-v41.3),
# for both darwin-arm64 and darwin-x64. Because both prebuilts exist, no
# native compilation happens here and both architectures can be produced on
# the Apple Silicon runner.
#
# Trigger manually from the Actions tab (workflow_dispatch) or on pushes to
# the build branch.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/web-github-pages-deploy-0i47y1

# Cancel superseded runs on the same branch so queued jobs don't pile up on
# the contended macOS runners.
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: build-mac (${{ matrix.arch }})
    # Apple Silicon runner: far less contended than the Intel tier, and it can
    # produce both architectures since only prebuilt binaries are downloaded.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    env:
      # electron's postinstall downloads a binary for the host arch; we don't
      # need it because @electron/packager fetches the Electron build it
      # packages. Skipping keeps installs fast and avoids arch mismatches.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @electron/packager 20 requires >= 22.12.0; nodegit 0.28 requires >= 20.
          node-version: '22'

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          python3 --version || true
          xcodebuild -version || true

      - name: Configure .npmrc for Electron / ${{ matrix.arch }}
        # target must stay in lockstep with the electron devDependency so
        # node-pre-gyp resolves the matching nodegit prebuilt (electron-v41.3).
        run: |
          cat > ./.npmrc <<EOF
          runtime = electron
          target = 41.3.0
          target_arch = ${{ matrix.arch }}
          disturl = "https://electronjs.org/headers"
          EOF
          cat ./.npmrc

      - name: Install dependencies
        run: npm install

      - name: Verify nodegit resolved to a prebuilt binary
        # If the prebuilt download had silently fallen back to a source build,
        # the binary would be missing or built for the wrong arch. Fail early
        # and loudly instead of shipping a broken .app.
        run: |
          BIN=node_modules/nodegit/build/Release/nodegit.node
          if [ ! -f "$BIN" ]; then
            echo "nodegit native binary not found at $BIN" >&2
            exit 1
          fi
          file "$BIN"
          file "$BIN" | grep -q "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}" || {
            echo "nodegit binary is not ${{ matrix.arch }}" >&2
            exit 1
          }

      - name: Pack renderer + main (webpack, production)
        run: npm run pack

      - name: Package the .app
        run: >-
          npx electron-packager . intergitive
          --platform=darwin
          --arch=${{ matrix.arch }}
          --overwrite
          --ignore="^/\.module_cache/"
          --ignore="^/test"
          --ignore="^/playground"
          --ignore="^/bake"
          --ignore="^/drawings"
          --ignore="^/dev"
          --ignore="^/src"
          --ignore="^/example/execution"
          --out="out"

      - name: Zip the packaged app
        run: |
          cd out
          APP_DIR="intergitive-darwin-${{ matrix.arch }}"
          if [ ! -d "$APP_DIR/intergitive.app" ]; then
            echo "Packaged output not found at $APP_DIR/intergitive.app" >&2
            ls -la
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/intergitive.app" "intergitive-mac-${{ matrix.arch }}.zip"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intergitive-mac-${{ matrix.arch }}
          path: out/intergitive-mac-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload npm debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs-${{ matrix.arch }}
          path: ~/.npm/_logs/*.log
          if-no-files-found: ignore
