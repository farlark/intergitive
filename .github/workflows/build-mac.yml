name: Build macOS app

# Builds the intergitive Electron app for macOS on a real Mac runner, where the
# native nodegit module is available for the target platform.
#
# We build x64: nodegit 0.26.5 ships a prebuilt binary for electron-v8.2 /
# darwin-x64 (no source compile needed), and an x64 Electron app also runs on
# Apple Silicon via Rosetta 2 -- so a single x64 build covers all Macs.
#
# (A native arm64 build is intentionally not produced: nodegit 0.26.5 has no
# arm64 prebuilt, and its from-source fallback downloads OpenSSL from the
# now-defunct Bintray, so it cannot build unpatched. Run the x64 app under
# Rosetta 2 on Apple Silicon instead.)
#
# Trigger manually from the Actions tab (workflow_dispatch) or on pushes to the
# build branch.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/web-github-pages-deploy-0i47y1

# Cancel superseded runs on the same branch so queued jobs don't pile up on the
# contended macOS runners.
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: build-mac (x64)
    # Runs on the Apple Silicon runner (far less contended than the Intel
    # macos-13 tier). We still build x64: node-pre-gyp fetches the prebuilt
    # nodegit binary by target_arch (x64), independent of the host arch, and
    # electron-packager pulls the x64 Electron — so no host-arch compilation is
    # needed and the result runs on all Macs (Apple Silicon via Rosetta 2).
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 16 is contemporary with nodegit 0.26.x / Electron 8.
          node-version: '16'

      - name: Set up Python 3.11
        # node-gyp (bundled with Node 16) imports distutils, removed in Python
        # 3.12+. Pin an interpreter that still ships it, in case anything falls
        # back to a source build.
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          python3 --version || true
          xcodebuild -version || true

      - name: Configure .npmrc for Electron / x64
        run: |
          cat > ./.npmrc <<EOF
          runtime = electron
          target = 8.2.0
          target_arch = x64
          disturl = "https://electronjs.org/headers"
          openssl_fips =
          EOF
          cat ./.npmrc

      - name: Install dependencies (nodegit uses the prebuilt electron-v8.2 x64 binary)
        env:
          PYTHON: ${{ steps.setup_python.outputs.python-path }}
          npm_config_python: ${{ steps.setup_python.outputs.python-path }}
        run: npm install

      - name: Pack renderer + main (webpack, production)
        run: npm run pack

      - name: Package the .app
        run: >-
          npx electron-packager . intergitive
          --platform=darwin
          --arch=x64
          --overwrite
          --ignore="^/\.module_cache/"
          --ignore="^/test"
          --ignore="^/playground"
          --ignore="^/bake"
          --ignore="^/drawings"
          --ignore="^/dev"
          --ignore="^/src"
          --ignore="^/example/execution"
          --out="out"

      - name: Zip the packaged app
        run: |
          cd out
          APP_DIR="intergitive-darwin-x64"
          if [ ! -d "$APP_DIR/intergitive.app" ]; then
            echo "Packaged output not found at $APP_DIR/intergitive.app" >&2
            ls -la
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/intergitive.app" "intergitive-mac-x64.zip"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intergitive-mac-x64
          path: out/intergitive-mac-x64.zip
          if-no-files-found: error
