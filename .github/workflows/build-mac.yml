name: Build macOS app

# Builds the intergitive Electron app for macOS on real Mac runners, where the
# native `nodegit` module can be compiled for the target platform. The packaged
# .app is zipped and uploaded as a workflow artifact.
#
# A matrix builds both architectures, each on a host of the matching arch so
# nodegit compiles natively:
#   - arm64 on macos-14 (Apple Silicon) -- usually the least contended runner
#   - x64   on macos-13 (Intel)         -- also runs on Apple Silicon via Rosetta
#
# Trigger manually from the Actions tab (workflow_dispatch) or on pushes to the
# build branch.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/web-github-pages-deploy-0i47y1

jobs:
  build-mac:
    name: build-mac (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 16 is contemporary with nodegit 0.26.x / Electron 8 and avoids
          # incompatibilities between very new node-gyp/node-pre-gyp and the
          # 2019-era native toolchain nodegit ships with.
          node-version: '16'

      - name: Set up Python 3.11
        # node-gyp (bundled with Node 16) imports distutils, which was removed
        # from Python 3.12+. The runner's default Python is 3.14, so pin an
        # interpreter that still ships distutils.
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          python3 --version || true
          xcodebuild -version || true

      - name: Configure .npmrc for Electron / ${{ matrix.arch }}
        # Pin the native build to the Electron ABI used by the packaged app and
        # to this runner's architecture so nodegit compiles natively.
        run: |
          # NOTE: the historical disturl atom.io/download/atom-shell is dead
          # (Atom was sunset), which makes node-gyp download an HTML page
          # instead of the Electron headers tarball. Use the current host.
          cat > ./.npmrc <<EOF
          runtime = electron
          target = 8.2.0
          target_arch = ${{ matrix.arch }}
          disturl = "https://electronjs.org/headers"
          openssl_fips =
          EOF
          cat ./.npmrc

      - name: Install dependencies (builds nodegit for Electron)
        env:
          # Force node-gyp to use the distutils-capable interpreter.
          PYTHON: ${{ steps.setup_python.outputs.python-path }}
          npm_config_python: ${{ steps.setup_python.outputs.python-path }}
        run: npm install

      - name: Pack renderer + main (webpack, production)
        run: npm run pack

      - name: Package the .app
        run: >-
          npx electron-packager . intergitive
          --platform=darwin
          --arch=${{ matrix.arch }}
          --overwrite
          --ignore="^/\.module_cache/"
          --ignore="^/test"
          --ignore="^/playground"
          --ignore="^/bake"
          --ignore="^/drawings"
          --ignore="^/dev"
          --ignore="^/src"
          --ignore="^/example/execution"
          --out="out"

      - name: Zip the packaged app
        run: |
          cd out
          APP_DIR="intergitive-darwin-${{ matrix.arch }}"
          if [ ! -d "$APP_DIR/intergitive.app" ]; then
            echo "Packaged output not found at $APP_DIR/intergitive.app" >&2
            ls -la
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/intergitive.app" "intergitive-mac-${{ matrix.arch }}.zip"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intergitive-mac-${{ matrix.arch }}
          path: out/intergitive-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
